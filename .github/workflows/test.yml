name: Test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CPython 3.11 is the interpreter the shipped scripts and pyrightconfig.json
      # target. Renewal: revisit with the weekly Dependabot pip bump and before
      # 3.11 reaches end of life (October 2027); no scanner tracks this pin.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: python -m pip install --upgrade pip
      # The hashed lock is compiled from requirements-dev.txt with
      # `uv pip compile requirements-dev.txt --python-version 3.11 --generate-hashes`.
      - run: python -m pip install --require-hashes -r requirements-dev.lock

      # Lint runs before tests per `jbaruch/coding-policy: code-formatting`.
      - name: Lint (ruff)
        run: |
          python -m ruff check tests/ skills/
          python -m ruff format --check tests/ skills/

      # Language diagnostics gate per `jbaruch/coding-policy: language-diagnostics`:
      # pyright must report zero findings before pytest runs.
      - name: Type check (pyright)
        run: python -m pyright

      - name: Pytest
        run: python -m pytest
