name: Test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Match the existing passing CI's CPython patch, not a floating input.
      # Renovate's github-actions manager tracks setup-python's python-version;
      # renovate.json schedules weekly updates within the supported 3.11 line.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (existing CI resolution)
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      # The hashed lock is compiled from requirements-dev.txt with
      # `uv pip compile requirements-dev.txt --python-version 3.11 --generate-hashes`.
      - run: python -m pip install --require-hashes -r requirements-dev.lock

      # Lint runs before tests per `jbaruch/coding-policy: code-formatting`.
      - name: Format (ruff)
        run: python -m ruff format --check tests/ skills/

      - name: Lint (ruff)
        run: python -m ruff check tests/ skills/

      # Language diagnostics gate per `jbaruch/coding-policy: language-diagnostics`:
      # pyright must report zero findings before pytest runs.
      - name: Type check (pyright)
        run: python -m pyright

      - name: Pytest
        run: python -m pytest
